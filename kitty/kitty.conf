# Tipografía
font_family      JetBrainsMono Nerd Font
font_size        14.0
disable_ligatures never

# Interfaz de ventana
window_padding_width 15
hide_window_decorations yes
confirm_os_window_close 0
background_opacity 0.85

# Colores base
background #150413 
foreground #edf6d6

# Cursor y selección
cursor #edf6d6
cursor_text_color #3e232c
selection_background #edf6d6
selection_foreground #3e232c

# Colores de la terminal
# Negro / Gris
color0 #0f052d
color8 #203671
# Rojo
color1 #ff5555
color9 #ff9999
# Verde
color2 #5fc75d
color10 #5fc75d
# Amarillo
color3 #f1fa8c
color11 #f1fa8c
# Azul
color4 #36868f
color12 #36868f
# Magenta
color5 #ff79c6
color13 #ff79c6
# Cyan
color6 #36868f
color14 #36868f
# Blanco
color7 #f8f8f2
color15 #ffffff
